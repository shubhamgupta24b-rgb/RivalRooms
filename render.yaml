# Render Blueprint: New > Blueprint > this repository.
# Native Node web service. Root directory is server/. Docker is optional and not required.
services:
  - type: web
    name: rivalrooms
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: guest
      # Render asks for this. Generate a random string of at least 16 characters. Do not commit it.
      - key: GUEST_TOKEN_SECRET
        sync: false
      # Shown on the privacy policy page (/privacy). Render asks for it when you create the Blueprint.
      - key: PRIVACY_CONTACT
        sync: false
