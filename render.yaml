# Render Blueprint: New > Blueprint > this repository.
# Native Node web service. Root directory is server/. Docker is optional and not required.
services:
  - type: web
    name: rivalrooms
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: dev
      # Guest logins on a public server: fine for playing with friends, not for a store release.
      - key: ALLOW_DEV_AUTH
        value: "true"
      # Shown on the privacy policy page (/privacy). Render asks for it when you create the Blueprint.
      - key: PRIVACY_CONTACT
        sync: false
